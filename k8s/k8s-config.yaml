apiVersion: apps/v1
kind: Deployment

metadata:
  name: student-performance-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: student-performance-app

  template:
    metadata:
      labels:
        app: student-performance-app

    spec:
      containers:
        - name: student-performance-container

          image: nathanirahul/student-performance-ml:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 8501

---

apiVersion: v1
kind: Service

metadata:
  name: student-performance-service

spec:
  type: NodePort

  selector:
    app: student-performance-app

  ports:
    - port: 8501
      targetPort: 8501
      nodePort: 30001
